name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Extract source
        run: unzip netbird_source.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Get dependencies
        run: cd netbird && flutter pub get
      - name: Build APK
        run: cd netbird && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: netbird-apk
          path: netbird/build/app/outputs/flutter-apk/app-release.apk
